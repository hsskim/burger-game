    // grid 문자열 배열 → 셀 2차원 배열로 파싱
    function parseStage(data) {
      const rows = data.grid.length;
      const cols = data.grid[0].length;
      const cells = [];
      let startCol = 1;
      let startRow = 1;

      for (let r = 0; r < rows; r++) {
        const line = data.grid[r];
        const rowCells = [];
        for (let c = 0; c < cols; c++) {
          const ch = line[c];
          const cell = { type: 'floor', emoji: null };
          if (ch === '#') {
            cell.type = 'wall';
          } else if (ch === 'S') {
            startCol = c;
            startRow = r;
          } else if (ch === 'X') {
            cell.type = 'trap';
            cell.trapKey = TRAP_KEYS[Math.floor(Math.random() * TRAP_KEYS.length)];
            cell.emoji = TRAPS[cell.trapKey].emoji;
          } else if (INGREDIENTS[ch]) {
            cell.type = 'ingredient';
            cell.code = ch;
            cell.emoji = INGREDIENTS[ch].emoji;
          }
          rowCells.push(cell);
        }
        cells.push(rowCells);
      }
      // 맵이 커질수록 셀을 줄여 정사각 게임 영역(GAME_SIZE) 안에 항상 들어오게 한다
      const cell = Math.min(CELL_MAX, Math.floor(GAME_SIZE / Math.max(rows, cols)));
      return { ...data, rows, cols, cells, startCol, startRow, cell };

    // 재료 이름 → 코드 역매핑 (renderOrder·솔버 공용)
    const NAME_TO_CODE = {};
    for (const code of Object.keys(INGREDIENTS)) NAME_TO_CODE[INGREDIENTS[code].name] = code;

    // 파싱된 스테이지에서 조건을 만족하는 첫 셀 좌표 {r, c} 반환
    function findCell(parsed, pred) {
      for (let r = 0; r < parsed.rows; r++) {
        for (let c = 0; c < parsed.cols; c++) {
          if (pred(parsed.cells[r][c])) return { r, c };
        }
      }
      return null;
    }

    // from → to 최단 칸 수 (도달 불가 시 -1). avoidTraps면 함정 칸을 벽처럼 막는다(단 목적지는 예외).
    // from → to 최단 칸 수 (도달 불가 -1). avoidTraps면 함정 칸을, blocked(Set of "r,c")면 해당 칸을
    // 벽처럼 막는다. 단 목적지(to)는 어느 경우든 통과 허용.
    function bfsDist(parsed, from, to, avoidTraps, blocked) {
      const { rows, cols, cells } = parsed;
      const dist = Array.from({ length: rows }, () => new Array(cols).fill(-1));
      const q = [from];
      dist[from.r][from.c] = 0;
      const STEPS = [[0, -1], [0, 1], [-1, 0], [1, 0]];
      for (let head = 0; head < q.length; head++) {
        const cur = q[head];
        if (cur.r === to.r && cur.c === to.c) return dist[cur.r][cur.c];
        for (const [dc, dr] of STEPS) {
          const nr = cur.r + dr, nc = cur.c + dc;
          if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
          if (dist[nr][nc] !== -1) continue;
          const isTarget = nr === to.r && nc === to.c;
          const cell = cells[nr][nc];
          if (cell.type === 'wall') continue;
          if (avoidTraps && cell.type === 'trap' && !isTarget) continue;
          if (blocked && blocked.has(nr + ',' + nc) && !isTarget) continue;
          dist[nr][nc] = dist[cur.r][cur.c] + 1;
          q.push({ r: nr, c: nc });
        }
      }
      return -1;
    }

    // 스테이지 데이터 검증: 도달성·3별 경로 존재·최적 소요 시간·시간 여유
    // 게임은 밟는 즉시 먹으므로, 별 3개(순서 정확) 경로는 함정뿐 아니라 "아직 먹을 차례가 아닌
    // 재료 칸"도 밟지 않아야 한다 → perfectPath는 미래 재료를 벽처럼 막고 순서대로 도달 가능한지 검사.
    // { reachable, perfectPath, optimalMoves, optimalTime, timeOk }
    function validateStage(data) {
      const parsed = parseStage(data);
      const positions = [];
      for (const name of parsed.recipe) {
        const pos = findCell(parsed, (cell) => cell.type === 'ingredient' && cell.code === NAME_TO_CODE[name]);
        if (!pos) return { reachable: false, perfectPath: false, optimalMoves: Infinity, optimalTime: Infinity, timeOk: false };
        positions.push(pos);
      }
      const seq = [{ r: parsed.startRow, c: parsed.startCol }, ...positions];
      const keyOf = (p) => p.r + ',' + p.c;

      let reachable = true;    // 순서대로 도달 가능(함정·재료 통과 허용)
      let perfectPath = true;  // 함정·미래 재료를 밟지 않고 순서대로 도달 가능(별 3개 경로)
      let movesAny = 0;        // 함정 허용 최단 경로 합
      let movesSafe = 0;       // 별 3개 경로 최단 합
      for (let i = 0; i < seq.length - 1; i++) {
        const dAny = bfsDist(parsed, seq[i], seq[i + 1], false, null);
        if (dAny < 0) reachable = false;
        movesAny += Math.max(0, dAny);

        // 이번 구간에서 아직 먹을 차례가 아닌 재료(seq[i+2..])를 벽 취급
        const blocked = new Set();
        for (let j = i + 2; j < seq.length; j++) blocked.add(keyOf(seq[j]));
        const dSafe = bfsDist(parsed, seq[i], seq[i + 1], true, blocked);
        if (dSafe < 0) perfectPath = false;
        movesSafe += Math.max(0, dSafe);
      }

      // 별 3개 경로가 있으면 그 길이를, 없으면 함정 허용 경로 길이를 기준 시간으로 삼는다
      const optimalMoves = perfectPath ? movesSafe : movesAny;
      const optimalTime = reachable ? optimalMoves / MOVES_PER_SEC : Infinity;
      const timeOk = optimalTime <= data.timeLimit * 0.7;
      return { reachable, perfectPath, optimalMoves, optimalTime, timeOk };
    }

    // 개발용: 기존 스테이지 데이터가 설계 원칙(3별 경로·시간 여유)을 만족하는지 콘솔 경고
    function verifyStages() {
      for (const data of STAGES) {
        const v = validateStage(data);
        if (!v.reachable || !v.perfectPath || !v.timeOk) {
          console.warn(`[stage ${data.id} "${data.name}"] 검증 경고`, v);
        }
      }
    }

    // ===== 무한 모드 절차 생성 =====
    // 문자 격자(벽 '#'만 판정) 기반 헬퍼. 재료·시작점은 통과 가능, 함정은 trapSet으로 별도 차단.
    const GEN_STEPS = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    function shuffleInPlace(a) {
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 재귀 백트래킹 미로 (홀수 크기). 통로 1칸 폭, 불규칙한 벽.
    function genMaze(N) {
      const g = Array.from({ length: N }, () => new Array(N).fill('#'));
      const st = [[1, 1]];
      g[1][1] = '.';
      while (st.length) {
        const [r, c] = st[st.length - 1];
        const dirs = shuffleInPlace([[0, -2], [0, 2], [-2, 0], [2, 0]]);
        let moved = false;
        for (const [dr, dc] of dirs) {
          const nr = r + dr, nc = c + dc;
          if (nr > 0 && nr < N - 1 && nc > 0 && nc < N - 1 && g[nr][nc] === '#') {
            g[r + dr / 2][c + dc / 2] = '.';
            g[nr][nc] = '.';
            st.push([nr, nc]);
            moved = true;
            break;
          }
        }
        if (!moved) st.pop();
      }
      return g;
    }

    // 우회로(루프) 추가: 두 통로 사이 벽을 확률적으로 허물어 복수 경로를 만든다
    function braidMaze(g, N, prob) {
      for (let r = 1; r < N - 1; r++) {
        for (let c = 1; c < N - 1; c++) {
          if (g[r][c] !== '#') continue;
          const h = g[r][c - 1] === '.' && g[r][c + 1] === '.';
          const v = g[r - 1][c] === '.' && g[r + 1][c] === '.';
          if ((h || v) && Math.random() < prob) g[r][c] = '.';
        }
      }
    }

    function floorsOf(g, N) {
      const f = [];
      for (let r = 1; r < N - 1; r++) for (let c = 1; c < N - 1; c++) if (g[r][c] === '.') f.push([r, c]);
      return f;
    }

    // 열린 이웃 수 (1이면 막다른 골목 — 재료를 두면 들어갔다 그대로 되돌아 나와야 함)
    function degreeAt(g, N, p) {
      let d = 0;
      for (const [dr, dc] of GEN_STEPS) {
        const nr = p[0] + dr, nc = p[1] + dc;
        if (nr >= 0 && nr < N && nc >= 0 && nc < N && g[nr][nc] !== '#') d++;
      }
      return d;
    }

    // 문자 격자에서 from → to 최단 경로(칸 배열) 반환, 없으면 null
    function bfsPathChar(g, N, from, to, trapSet, blocked) {
      const prev = Array.from({ length: N }, () => new Array(N).fill(null));
      const seen = Array.from({ length: N }, () => new Array(N).fill(false));
      const q = [from];
      seen[from[0]][from[1]] = true;
      for (let h = 0; h < q.length; h++) {
        const cur = q[h];
        if (cur[0] === to[0] && cur[1] === to[1]) {
          const path = [];
          for (let p = cur; p; p = prev[p[0]][p[1]]) path.push(p);
          return path.reverse();
        }
        for (const [dr, dc] of GEN_STEPS) {
          const nr = cur[0] + dr, nc = cur[1] + dc;
          if (nr < 0 || nr >= N || nc < 0 || nc >= N || seen[nr][nc]) continue;
          const isT = nr === to[0] && nc === to[1];
          if (g[nr][nc] === '#') continue;
          if (trapSet && trapSet.has(nr + ',' + nc) && !isT) continue;
          if (blocked && blocked.has(nr + ',' + nc) && !isT) continue;
          seen[nr][nc] = true;
          prev[nr][nc] = cur;
          q.push([nr, nc]);
        }
      }
      return null;
    }
    function distChar(g, N, from, to, trapSet, blocked) {
      const p = bfsPathChar(g, N, from, to, trapSet, blocked);
      return p ? p.length - 1 : -1;
    }

    // 한 판 생성 시도: 재료 분산 배치 + 최근접 순회 순서 + 지름길 위 함정. 실패 시 null.
    function buildEndlessMap(N, k, trapTarget, codes) {
      const g = genMaze(N);
      braidMaze(g, N, ENDLESS.braid);
      const fl = floorsOf(g, N);
      if (fl.length < 1 + k + trapTarget + 6) return null;

      // 시작점: 좌상단에 가까운 floor
      const sorted = fl.slice().sort((a, b) => (a[0] + a[1]) - (b[0] + b[1]));
      const S = sorted[Math.floor(Math.random() * Math.min(3, sorted.length))];
      const key = (p) => p[0] + ',' + p[1];

      // 재료: 서로/시작점과 최소 거리 이상으로 흩뿌리기
      const cand = shuffleInPlace(fl.filter((p) => key(p) !== key(S)));
      const items = [];
      for (const p of cand) {
        if (items.length >= k) break;
        if (degreeAt(g, N, p) < 2) continue; // 막다른 골목엔 재료를 두지 않는다
        if (distChar(g, N, S, p, null, null) < ENDLESS.minDist) continue;
        if (items.some((q) => distChar(g, N, q, p, null, null) < ENDLESS.minDist)) continue;
        items.push(p);
      }
      if (items.length < k) return null;

      // 최근접 순회 순서로 레시피 배정 → 되돌아가기 최소화
      const order = [];
      const rem = items.slice();
      let cur = S;
      while (rem.length) {
        let bi = 0, bd = Infinity;
        for (let i = 0; i < rem.length; i++) {
          const d = distChar(g, N, cur, rem[i], null, null);
          if (d >= 0 && d < bd) { bd = d; bi = i; }
        }
        order.push(rem[bi]);
        cur = rem[bi];
        rem.splice(bi, 1);
      }

      const grid = g.map((row) => row.slice());
      grid[S[0]][S[1]] = 'S';
      order.forEach((p, i) => { grid[p[0]][p[1]] = codes[i]; });
      const seq = [S, ...order];

      // 함정: "함정 무시 순서 최단 경로"(지름길) 내부 칸에 얹어 안전 경로가 우회하도록
      const shortcut = [];
      for (let i = 0; i < seq.length - 1; i++) {
        const blocked = new Set();
        for (let j = i + 2; j < seq.length; j++) blocked.add(key(seq[j]));
        const path = bfsPathChar(grid, N, seq[i], seq[i + 1], null, blocked);
        if (!path) return null;
        for (let t = 1; t < path.length - 1; t++) shortcut.push(path[t]);
      }
      const itemSet = new Set(seq.map(key));
      const adjS = new Set(GEN_STEPS.map(([dr, dc]) => (S[0] + dr) + ',' + (S[1] + dc)));
      const trapSet = new Set();
      for (const p of shuffleInPlace(shortcut.filter((p) => !itemSet.has(key(p)) && !adjS.has(key(p))))) {
        if (trapSet.size >= trapTarget) break;
        const kp = key(p);
        if (trapSet.has(kp)) continue;
        // 함정끼리 붙지 않게
        if ([...trapSet].some((t) => {
          const [tr, tc] = t.split(',').map(Number);
          return Math.abs(tr - p[0]) + Math.abs(tc - p[1]) < 2;
        })) continue;
        trapSet.add(kp);
        // 이 함정 추가 후에도 순서대로 안전 경로가 남는지 확인, 아니면 취소
        let ok = true;
        for (let i = 0; i < seq.length - 1 && ok; i++) {
          const blocked = new Set();
          for (let j = i + 2; j < seq.length; j++) blocked.add(key(seq[j]));
          if (distChar(grid, N, seq[i], seq[i + 1], trapSet, blocked) < 0) ok = false;
        }
        if (!ok) trapSet.delete(kp);
      }
      for (const t of trapSet) {
        const [r, c] = t.split(',').map(Number);
        grid[r][c] = 'X';
      }

      const gridStr = grid.map((row) => row.join(''));
      const recipe = codes.map((code) => INGREDIENTS[code].name);
      const v = validateStage({ timeLimit: 999, recipe, grid: gridStr });
      if (!v.reachable || !v.perfectPath) return null;

      // 되돌아감(재방문 칸) 측정: 별 3개 경로를 이어붙여 중복 방문 칸 수 계산 (작을수록 좋음)
      const safe = [];
      for (let i = 0; i < seq.length - 1; i++) {
        const blocked = new Set();
        for (let j = i + 2; j < seq.length; j++) blocked.add(key(seq[j]));
        const path = bfsPathChar(grid, N, seq[i], seq[i + 1], trapSet, blocked);
        if (!path) return null;
        for (let t = (i > 0 ? 1 : 0); t < path.length; t++) safe.push(key(path[t]));
      }
      const revisits = safe.length - new Set(safe).size;
      return { grid: gridStr, recipe, revisits };
    }

    // 라운드에 맞는 스테이지 데이터 생성. 여러 후보 중 되돌아감이 가장 적은 맵을 채택.
    function generateStage(round) {
      const N = ENDLESS.size(round);
      const k = ENDLESS.ingredients(round);
      const trapTarget = ENDLESS.traps(round);
      const allCodes = Object.keys(INGREDIENTS);
      let best = null;
      // 되돌아감 0인 맵을 찾으면 즉시 채택, 아니면 최선을 고른다.
      // 큰 맵은 판당 생성 비용이 커서 시도 횟수를 줄여 라운드 전환 끊김을 방지.
      const cap = N <= 9 ? 150 : N <= 11 ? 90 : 50;
      for (let attempt = 0; attempt < cap && !(best && best.revisits === 0); attempt++) {
        const codes = shuffleInPlace(allCodes.slice()).slice(0, k);
        const built = buildEndlessMap(N, k, trapTarget, codes);
        if (!built) continue;
        if (!best || built.revisits < best.revisits) best = built;
      }
      if (best) {
        return { id: round, name: `라운드 ${round}`, timeLimit: ENDLESS.time(round), recipe: best.recipe, grid: best.grid };
      }
      // 극히 드문 생성 실패 대비: 안전한 최소 맵
      return {
        id: round, name: `라운드 ${round}`, timeLimit: ENDLESS.time(round),
        recipe: ['patty', 'cheese'],
        grid: ['#########', '#S......#', '#.......#', '#...P...#', '#.......#', '#...C...#', '#.......#', '#.......#', '#########'],
      };
    }

    function loadStage(data) {
      currentStageData = data;
      stage = parseStage(data);
      player = {
        col: stage.startCol,
        row: stage.startRow,
        drawX: stage.startCol,
        drawY: stage.startRow,
      };
      moveCooldown = 0;
      stack = [];
      lastEatAt = 0;
      completed = false;
      timeLeft = stage.timeLimit;
      failed = false;
      failedReason = null;
      failComment = '';
      stars = 0;
    }

    // ===== 진행 저장 (localStorage) =====
    function loadSave() {
      try {
        return JSON.parse(localStorage.getItem(SAVE_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveStars(stageId, earned) {
      const save = loadSave();
      save[stageId] = Math.max(save[stageId] || 0, earned);
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    }

    // 무한 모드 최고 기록 조회/저장 (최고 라운드 + 그 런의 평균 별점)
    function loadEndlessRecord() {
      try {
        const o = JSON.parse(localStorage.getItem(ENDLESS_SAVE_KEY)) || {};
        return { bestRound: o.bestRound || 0, bestAvg: o.bestAvg || 0 };
      } catch {
        return { bestRound: 0, bestAvg: 0 };
      }
    }

    // 더 멀리 갔거나(라운드↑), 같은 라운드에서 더 깔끔하면(평균 별점↑) 기록 갱신
    function saveEndlessRecord(round, avg) {
      const cur = loadEndlessRecord();
      if (round > cur.bestRound || (round === cur.bestRound && avg > cur.bestAvg)) {
        localStorage.setItem(ENDLESS_SAVE_KEY, JSON.stringify({ bestRound: round, bestAvg: avg }));
      }
    }

    // 맵을 정사각 게임 영역 중앙에 배치하기 위한 오프셋
    function mapOffset() {
      return {
        x: GAME_X + Math.floor((GAME_SIZE - stage.cols * stage.cell) / 2),
        y: GAME_Y + Math.floor((GAME_SIZE - stage.rows * stage.cell) / 2),
      };
    }

    // ===== 입력 =====
    const KEY_DIRS = {
      ArrowUp: [0, -1], KeyW: [0, -1],
      ArrowDown: [0, 1], KeyS: [0, 1],
      ArrowLeft: [-1, 0], KeyA: [-1, 0],
      ArrowRight: [1, 0], KeyD: [1, 0],
    };

    // i번째 스테이지 잠금 해제 여부 (첫 스테이지이거나 이전 스테이지를 클리어)
    function isUnlocked(i) {
      return i === 0 || loadSave()[STAGES[i - 1].id] !== undefined;
    }

    function exitToSelect() {
      screen = 'select';
      selectedIndex = currentStageIndex;
      heldDirs = [];
      confirming = null;
    }

    // 플레이/결과에서 나가기: 스토리는 선택 화면, 무한은 타이틀로
    function exitPlay() {
      if (mode === 'endless') {
        screen = 'title';
        heldDirs = [];
        confirming = null;
      } else {
        exitToSelect();
      }
    }

    // 온보딩: 스토리 모드는 1회만, 무한 모드는 매번 표시
    function maybeOnboard(kind, condition) {
      if (!condition) return;
      if (kind === 'endless') {
        onboarding = kind;
        return;
      }
      if (localStorage.getItem(ONBOARD_STORY_KEY)) return;
      onboarding = kind;
    }

    function dismissOnboarding() {
      if (!onboarding) return;
      if (onboarding === 'story') {
        try { localStorage.setItem(ONBOARD_STORY_KEY, '1'); } catch { /* 저장 실패는 무시 */ }
      }
      onboarding = null;
    }

    // 스토리 모드 스테이지 시작 (선택 화면·카드 클릭 공용). 스테이지1 첫 진입 시 온보딩.
    function startStory(i) {
      mode = 'story';
      selectedIndex = i;
      currentStageIndex = i;
      loadStage(STAGES[i]);
      screen = 'play';
      heldDirs = [];
      confirming = null;
      maybeOnboard('story', STAGES[i].id === 1);
    }

    // 무한 모드 시작 (1라운드부터 새 게임, 목숨 초기화). 첫 진입 시 온보딩.
    function startEndless() {
      mode = 'endless';
      endlessRound = 1;
      endlessLives = ENDLESS.startLives;
      endlessClears = 0;
      endlessStarSum = 0;
      loadStage(generateStage(endlessRound));
      screen = 'play';
      heldDirs = [];
      confirming = null;
      maybeOnboard('endless', true);
    }

    // 무한 모드 실패 화면에서 진행: 목숨이 남았으면 같은 맵 재도전, 소진됐으면 새 런
    function endlessAfterFail() {
      if (endlessLives > 0) restartStage();
      else startEndless();
    }

    // 현재 판을 처음부터 다시 (모드 무관, 같은 맵)
    function restartStage() {
      loadStage(currentStageData);
    }

    // 다음 판이 존재하는가 (스토리는 마지막 스테이지 여부, 무한은 항상 존재)
    function hasNext() {
      return mode === 'endless' || currentStageIndex + 1 < STAGES.length;
    }

    // 다음 판으로 진행 (스토리는 다음 스테이지, 무한은 다음 라운드 생성)
    function goNext() {
      if (mode === 'endless') {
        endlessRound += 1;
        loadStage(generateStage(endlessRound));
        return;
      }
      if (currentStageIndex + 1 < STAGES.length) {
        currentStageIndex += 1;
        loadStage(STAGES[currentStageIndex]);
      }
    }

    window.addEventListener('keydown', (e) => {
      // --- 타이틀 화면 ---
      if (screen === 'title') {
        if (e.code === 'Enter') {
          e.preventDefault();
          screen = 'select';
        } else if (e.code === 'Space') {
          e.preventDefault();
          startEndless();
        }
        return;
      }

      // --- 스테이지 선택 화면 ---
      if (screen === 'select') {
        e.preventDefault();
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
          selectedIndex = Math.max(0, selectedIndex - 1);
        } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
          selectedIndex = Math.min(STAGES.length - 1, selectedIndex + 1);
        } else if (e.code === 'ArrowUp' || e.code === 'KeyW') {
          selectedIndex = Math.max(0, selectedIndex - SELECT_COLS);
        } else if (e.code === 'ArrowDown' || e.code === 'KeyS') {
          selectedIndex = Math.min(STAGES.length - 1, selectedIndex + SELECT_COLS);
        } else if (e.code === 'Enter' || e.code === 'Space') {
          if (isUnlocked(selectedIndex)) startStory(selectedIndex);
        } else if (e.code === 'Escape') {
          screen = 'title';
        }
        return;
      }

      // --- 플레이 화면 ---
      // 온보딩 팝업: 아무 키로 닫고 시작
      if (onboarding) {
        e.preventDefault();
        if (e.code === 'Enter' || e.code === 'Space' || e.code === 'Escape') dismissOnboarding();
        return;
      }

      // 확인 팝업이 떠 있는 동안은 Enter(확인)/ESC(취소)만 받는다
      if (confirming) {
        e.preventDefault();
        if (e.code === 'Enter') {
          const action = confirming;
          confirming = null;
          if (action === 'restart') restartStage();
          else exitPlay();
        } else if (e.code === 'Escape') {
          confirming = null;
        }
        return;
      }

      // 결과(클리어/실패) 오버레이
      if (completed || failed) {
        if (mode === 'endless') {
          if (failed) {
            // 목숨 남으면 Enter로 같은 맵 재개, 소진되면 R로 새 런
            if (e.code === 'Enter' && endlessLives > 0) endlessAfterFail();
            else if (e.code === 'KeyR' && endlessLives === 0) endlessAfterFail();
            else if (e.code === 'Escape') exitPlay();
          } else {
            // 클리어: Enter 다음 라운드, ESC 타이틀 (R 재시작 없음 — 목숨 파밍 방지)
            if (e.code === 'Enter' && hasNext()) goNext();
            else if (e.code === 'Escape') exitPlay();
          }
        } else {
          if (e.code === 'KeyR') restartStage();
          else if (e.code === 'Escape') exitToSelect();
          else if (e.code === 'Enter' && completed && hasNext()) goNext();
        }
        return;
      }

      if (KEY_DIRS[e.code]) {
        e.preventDefault();
        if (!heldDirs.includes(e.code)) heldDirs.push(e.code);
      } else if (e.code === 'KeyR' && mode !== 'endless') {
        // 무한 모드는 자유 재시작 없음 (실패 시 재도전 1회 규칙을 우회하지 못하게)
        confirming = 'restart';
        heldDirs = [];
      } else if (e.code === 'Escape') {
        confirming = 'exit';
        heldDirs = [];
      }
    });

    window.addEventListener('keyup', (e) => {
      heldDirs = heldDirs.filter((code) => code !== e.code);
    });

    // ===== 마우스 =====
    // 커스텀 커서: 통통한 노란 화살표 (SVG 데이터 URI, 단일 파일 유지)
    const CURSOR_ARROW_SVG = `<svg xmlns='http://www.w3.org/2000/svg' width='38' height='38' viewBox='0 0 38 38'><path d='M7 3 L7 30 L14 24 L19 34 L25 31 L20 22 L29 22 Z' fill='#ffd54a' stroke='#8a6a3f' stroke-width='3' stroke-linejoin='round'/></svg>`;
    // 호버용: 통통한 장갑 손 모양 포인터
    const CURSOR_HOVER_SVG = `<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40' viewBox='0 0 40 40'><path d='M15 5 Q17.5 2.5 20 5 L20.5 15 L31 17.5 Q35.5 18.5 34.5 24 L33 31 Q32 36 26.5 36 L18.5 36 Q15.5 36 13.5 33.5 L7 25.5 Q5 22.5 7.5 20.5 Q10 18.5 12.5 21 L15 23.5 Z' fill='#ffd9a0' stroke='#8a6a3f' stroke-width='2.5' stroke-linejoin='round'/><path d='M20.5 16 L20.5 24 M25.5 17 L25.5 24 M30.5 18.5 L30.5 24' fill='none' stroke='#8a6a3f' stroke-width='1.8' stroke-linecap='round'/></svg>`;

    function cursorCss(svg, hx, hy, fallback) {
      return `url("data:image/svg+xml,${encodeURIComponent(svg)}") ${hx} ${hy}, ${fallback}`;
    }

    const CURSOR_DEFAULT = cursorCss(CURSOR_ARROW_SVG, 7, 3, 'auto');
    const CURSOR_HOVER = cursorCss(CURSOR_HOVER_SVG, 18, 3, 'pointer');

    let lastMouse = { x: -1, y: -1 }; // 캔버스 좌표 기준 마지막 마우스 위치

    function canvasPos(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left) * (CANVAS_W / rect.width),
        y: (e.clientY - rect.top) * (CANVAS_H / rect.height),
      };
    }

    function hitAreaAt(x, y) {
      // 늦게 그려진(위에 겹친) 영역 우선
      for (let i = hitAreas.length - 1; i >= 0; i--) {
        const a = hitAreas[i];
        if (x >= a.x && x <= a.x + a.w && y >= a.y && y <= a.y + a.h) return a;
      }
      return null;
    }

    canvas.addEventListener('click', (e) => {
      const { x, y } = canvasPos(e);
      const area = hitAreaAt(x, y);
      if (area) area.action();
    });

    canvas.addEventListener('mousemove', (e) => {
      lastMouse = canvasPos(e);
      const area = hitAreaAt(lastMouse.x, lastMouse.y);
      if (area && area.hoverAction) {
        area.hoverAction();
      }
    });

    // 화면 상태에 따라 커서 갱신 (플레이 중에는 숨김, 팝업이 뜨면 다시 표시)
    function updateCursor() {
      const playing = screen === 'play' && !confirming && !completed && !failed && !onboarding;
      if (playing) {
        canvas.style.cursor = 'none';
      } else {
        canvas.style.cursor = hitAreaAt(lastMouse.x, lastMouse.y) ? CURSOR_HOVER : CURSOR_DEFAULT;
      }
    }

    // 버튼을 그리고 클릭 영역으로 등록
    function drawButton(x, y, w, h, label, action) {
      const hovered = lastMouse.x >= x && lastMouse.x <= x + w
        && lastMouse.y >= y && lastMouse.y <= y + h;

      const push = hovered ? 4 : 0; // 호버 시 버튼이 눌리는 깊이
      const radius = h / 2;         // 완전한 둥근 알약(pill) 형태

      // 버튼 하단 그림자 (3D 깊이)
      ctx.fillStyle = hovered ? '#e0b88f' : COLORS.accentBorder;
      ctx.beginPath();
      ctx.roundRect(x, y + 4, w, h, radius);
      ctx.fill();

      // 버튼 윗면
      ctx.fillStyle = hovered ? '#ffeed0' : COLORS.accentSoft;
      ctx.strokeStyle = hovered ? COLORS.accent : COLORS.accentBorder;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y + push, w, h, radius);
      ctx.fill();
      ctx.stroke();

      // 버튼 텍스트
      ctx.fillStyle = COLORS.text;
      ctx.font = uiFont(FONT.body, 'bold');
      ctx.textAlign = 'center';
      fillTextVCenter(label, x + w / 2, y + push + h / 2);

      hitAreas.push({ x, y, w, h, action });
    }

    // 모드 선택용 다기능 카드 버튼 (2줄 텍스트 + 테마 지원)
    function drawModeButton(x, y, w, h, title, subtitle, theme, action) {
      const mx = lastMouse.x;
      const my = lastMouse.y;
      const hovered = mx >= x && mx <= x + w && my >= y && my <= y + h;
      const push = hovered ? 4 : 0;
      const radius = h / 2; // 알약 형태

      // 그림자
      ctx.fillStyle = theme.shadow;
      ctx.beginPath();
      ctx.roundRect(x, y + 4, w, h, radius);
      ctx.fill();

      // 윗면
      ctx.fillStyle = theme.bg;
      ctx.strokeStyle = hovered ? theme.borderHover : theme.border;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x, y + push, w, h, radius);
      ctx.fill();
      ctx.stroke();

      // 타이틀
      ctx.fillStyle = COLORS.text;
      ctx.font = uiFont(FONT.h4, 'bold');
      ctx.textAlign = 'center';
      fillTextVCenter(title, x + w / 2, y + push + h / 2 - 10);

      // 서브타이틀
      ctx.fillStyle = COLORS.textSub;
      ctx.font = uiFont(FONT.caption);
      fillTextVCenter(subtitle, x + w / 2, y + push + h / 2 + 14);

      hitAreas.push({ x, y, w, h, action });
    }

    // 둥근 모서리 패널 (게임 영역·좌우 정보 패널 공용)
    function drawPanel(x, y, w, h) {
      ctx.shadowColor = 'rgba(120, 100, 80, 0.2)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 4;
      ctx.fillStyle = COLORS.panel;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 16);
      ctx.fill();

      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    }

    // 좌우 정보 패널 헤더 (제목 + 구분선). 주문서·내 버거 패널 공용.
    function drawPanelHeader(panelX, title) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = uiFont(FONT.body, 'bold');
      ctx.fillStyle = COLORS.text;
      ctx.fillText(title, panelX + SIDE_W / 2, GAME_Y + 28);

      ctx.strokeStyle = COLORS.panelBorder;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(panelX + 20, GAME_Y + 56);
      ctx.lineTo(panelX + SIDE_W - 20, GAME_Y + 56);
      ctx.stroke();
    }


    // 캔버스 middle baseline은 폰트 어센트/디센트가 비대칭이라 시각적으로 위쪽에 치우쳐 보인다.
    // 실제 글리프 경계(actualBoundingBox)를 측정해 baseline을 보정하면 정확히 정중앙에 그려진다.
    const textOffsetCache = {};
    function fillTextVCenter(text, cx, cy) {
      const key = ctx.font + ':' + text;
      let offset = textOffsetCache[key];
      if (offset === undefined) {
        ctx.textBaseline = 'alphabetic';
        const m = ctx.measureText(text);
        offset = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
        textOffsetCache[key] = offset;
      }
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(text, cx, cy + offset);
    }

    // 이모지 등 좌우 여백/중심이 불규칙한 문자를 완벽히 가로세로 중앙에 정렬하는 헬퍼
    const textCenterCache = {};
    function fillOpticalCenter(text, cx, cy) {
      const key = ctx.font + ':' + text;
      let off = textCenterCache[key];
      if (off === undefined) {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'alphabetic';
        const m = ctx.measureText(text);
        off = {
          x: (m.actualBoundingBoxLeft - m.actualBoundingBoxRight) / 2,
          y: (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2
        };
        textCenterCache[key] = off;
      }
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(text, cx + off.x, cy + off.y);
    }

    function tryMove(dc, dr) {
      const nc = player.col + dc;
      const nr = player.row + dr;
      if (nr < 0 || nr >= stage.rows || nc < 0 || nc >= stage.cols) return;
      if (stage.cells[nr][nc].type === 'wall') return;
      player.col = nc;
      player.row = nr;
      moveCooldown = MOVE_INTERVAL;
      eatCell(stage.cells[nr][nc]);
    }

    // 재료·함정 셀에 진입하면 즉시 섭취 (취소 불가)
    function eatCell(cell) {
      if (cell.type !== 'ingredient' && cell.type !== 'trap') return;
      stack.push({
        emoji: cell.emoji,
        code: cell.code || null,
        trapKey: cell.trapKey || null,
        isTrap: cell.type === 'trap',
        eatenAt: performance.now(),
      });
      if (cell.type === 'trap') shakeUntil = performance.now() + TRAP_SHAKE_MS;
      cell.type = 'floor';
      cell.emoji = null;
      cell.code = null;
      cell.trapKey = null;
      lastEatAt = performance.now();

      const trapCount = stack.filter(item => item.isTrap).length;
      if (trapCount >= 3) {
        triggerFail('trap');
        return;
      }

      checkComplete();
    }

    // 먹은 재료 이름 목록 (함정 제외, 먹은 순서대로)
    function eatenNames() {
      return stack
        .filter((item) => item.code)
        .map((item) => INGREDIENTS[item.code].name);
    }

    // 주문서 재료를 전부 먹으면 자동 완성 (순서가 틀려도 완성)
    function checkComplete() {
      const names = eatenNames();
      if (!completed && stage.recipe.every((name) => names.includes(name))) {
        completed = true;
        completedAt = performance.now();
        heldDirs = [];
        stars = computeStars();
        if (mode === 'endless') {
          endlessClears += 1;
          endlessStarSum += stars;
          saveEndlessRecord(endlessRound, endlessStarSum / endlessClears);
          // 완벽(3별) 클리어 보상: 목숨 +1 (상한 미만일 때만 실제 획득)
          endlessHeartEarned = stars === 3 && endlessLives < ENDLESS.maxLives;
          if (endlessHeartEarned) endlessLives += 1;
        } else {
          saveStars(stage.id, stars);
        }
      }
    }

    // 별점 채점: 별1 시간 내 완성 / 별2 함정 0개 / 별3 순서 정확(함정 제외)
    function computeStars() {
      const names = eatenNames();
      const orderOk = names.every((name, i) => name === stage.recipe[i]);
      const noTrap = !stack.some((item) => item.isTrap);
      return 1 + (noTrap ? 1 : 0) + (orderOk ? 1 : 0); // 완성 시 호출되므로 별1은 항상 획득
    }

    // 실패 처리: 무한 모드는 목숨을 하나 깎는다 (0이 되면 결과 화면에서 런 종료)
    function triggerFail(reason) {
      failed = true;
      failedReason = reason;
      failedAt = performance.now();
      const pool = reason === 'trap' ? FAIL_COMMENTS_TRAP : FAIL_COMMENTS_TIMEOUT;
      failComment = pool[Math.floor(Math.random() * pool.length)];
      heldDirs = [];
      if (mode === 'endless') endlessLives = Math.max(0, endlessLives - 1);
    }

    // ===== 게임 루프 =====
    function update(dt) {
      if (confirming || onboarding) return; // 팝업/온보딩 중에는 게임 정지

      // 타이머: 플레이 중에만 감소, 0이 되면 실패
      if (!completed && !failed) {
        timeLeft = Math.max(0, timeLeft - dt);
        if (timeLeft === 0) {
          triggerFail('timeout');
        }
      }

      moveCooldown = Math.max(0, moveCooldown - dt);
      if (!completed && !failed && heldDirs.length > 0 && moveCooldown === 0) {
        const [dc, dr] = KEY_DIRS[heldDirs[heldDirs.length - 1]];
        tryMove(dc, dr);
      }
      // 그리기 위치를 실제 칸 위치로 부드럽게 보간
      const t = Math.min(1, dt * LERP_SPEED);
      player.drawX += (player.col - player.drawX) * t;
      player.drawY += (player.row - player.drawY) * t;
    }

    function render() {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      hitAreas = []; // 매 프레임 현재 화면의 클릭 영역만 유지
      if (screen === 'title') renderTitle();
      else if (screen === 'select') renderSelect();
      else renderPlay();
    }

    const THEME_STAGE = {
      bg: COLORS.accentSoft,
      shadow: COLORS.accentBorder,
      border: COLORS.accentBorder,
      borderHover: COLORS.accent
    };

    const THEME_ENDLESS = {
      bg: '#eef7eb', // Soft pastel mint
      shadow: '#c0d9be', // Mint shadow
      border: '#c0d9be', // Mint border
      borderHover: '#7fa96e' // Vibrant mint hover
    };

    // 타이틀 화면
    function renderTitle() {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // 전체적으로 조금 위로 올려서 공간 확보
      const cy = CANVAS_H / 2 + 10;

      // 캐릭터 뒤에 부드러운 후광 효과 (햄버거 위치에 맞춰 Y 좌표 이동)
      const glow = ctx.createRadialGradient(CANVAS_W / 2, cy - 75, 0, CANVAS_W / 2, cy - 75, 160);
      glow.addColorStop(0, 'rgba(255, 255, 255, 0.8)');
      glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(CANVAS_W / 2 - 160, cy - 235, 320, 320);

      // 캐릭터 상하로 둥둥 떠다니는 애니메이션 (햄버거 위치 하향 조정)
      const floatY = Math.sin(performance.now() / 400) * 8;
      drawImg(IMG.charDefault, CANVAS_W / 2, cy - 85 + floatY, 2.4);

      // 타이틀 텍스트 (그림자로 입체감)
      ctx.shadowColor = 'rgba(120, 100, 80, 0.25)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;
      ctx.fillStyle = COLORS.text;
      ctx.font = uiFont(FONT.hero, 'bold');
      ctx.fillText('Burger Game v2', CANVAS_W / 2, cy - 15);

      // 그림자 초기화
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      ctx.font = uiFont(FONT.bodySm);
      ctx.fillStyle = COLORS.textSub;
      ctx.fillText('주문서 순서대로 재료를 먹어 버거를 완성하세요!', CANVAS_W / 2, cy + 30);

      // --- 좌우 나란히 배치되는 모드 선택 버튼 ---
      const btnW = 200;
      const btnH = 66;
      const gap = UI.gap;
      const leftX = CANVAS_W / 2 - btnW - gap / 2;
      const rightX = CANVAS_W / 2 + gap / 2;
      // 버튼 위치를 살짝 위로 다시 조정
      const btnY = cy + 90;

      // 1. 스테이지 모드
      drawModeButton(leftX, btnY, btnW, btnH, '스테이지 모드', 'Enter 눌러 시작', THEME_STAGE, () => {
        screen = 'select';
      });

      const save = loadSave();
      let clearedCount = 0;
      for (let i = 0; i < STAGES.length; i++) {
        if (save[STAGES[i].id] > 0) clearedCount++;
      }
      const stageRecord = clearedCount >= STAGES.length 
        ? '모든 스테이지 클리어!' 
        : `스테이지 ${clearedCount + 1} 진행 중`;

      ctx.font = uiFont(FONT.caption);
      ctx.fillStyle = COLORS.textSub;
      // 텍스트 간격을 아주 살짝 줄임 (32 -> 28)
      ctx.fillText(stageRecord, leftX + btnW / 2, btnY + btnH + 28);

      // 2. 무한 모드
      drawModeButton(rightX, btnY, btnW, btnH, '무한 모드', 'Space 눌러 시작', THEME_ENDLESS, () => {
        startEndless();
      });

      const rec = loadEndlessRecord();
      const endlessRecord = rec.bestRound > 0 
        ? `최고: ${rec.bestRound}라운드 · 평균 ★${rec.bestAvg.toFixed(1)}`
        : '한계에 도전하세요!';

      ctx.font = uiFont(FONT.caption);
      ctx.fillStyle = COLORS.textSub;
      // 텍스트 간격을 아주 살짝 줄임 (32 -> 28)
      ctx.fillText(endlessRecord, rightX + btnW / 2, btnY + btnH + 28);

      // 개발자 크레딧
      ctx.font = uiFont(FONT.caption);
      ctx.fillStyle = '#b0a89a';
      ctx.fillText('Developed by hsskim', CANVAS_W / 2, CANVAS_H - 24);
    }

    function drawLockIcon(cx, cy, size) {
      const bw = size * 0.7;
      const bh = size * 0.55;
      const bx = cx - bw / 2;
      const by = cy - bh / 2 + size * 0.15;
      const sw = size * 0.4;
      
      ctx.lineWidth = size * 0.12;
      ctx.lineCap = 'round';
      
      // 고리
      ctx.strokeStyle = '#c4b5a3'; // wall 색상 톤
      ctx.beginPath();
      ctx.arc(cx, by, sw / 2, Math.PI, 0);
      ctx.stroke();
      
      // 자물쇠 몸통
      ctx.fillStyle = '#e8c49a'; // 햄버거 빵 느낌의 부드러운 색
      ctx.beginPath();
      ctx.roundRect(bx, by, bw, bh, size * 0.1);
      ctx.fill();
      
      // 열쇠 구멍
      ctx.fillStyle = '#b39575';
      ctx.beginPath();
      ctx.arc(cx, by + bh * 0.4, size * 0.08, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - size * 0.06, by + bh * 0.4);
      ctx.lineTo(cx + size * 0.06, by + bh * 0.4);
      ctx.lineTo(cx + size * 0.12, by + bh * 0.75);
      ctx.lineTo(cx - size * 0.12, by + bh * 0.75);
      ctx.fill();
    }

    // 스테이지 선택 화면
    function renderSelect() {
      const save = loadSave();

      // 전체 화면 수직 중앙 정렬
      const titleY = 100;

      // 제목
      ctx.shadowColor = 'rgba(120, 100, 80, 0.2)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 2;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = COLORS.text;
      ctx.font = uiFont(FONT.h2, 'bold');
      ctx.fillText('스테이지 선택', CANVAS_W / 2, titleY);

      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      const cardW = 150;
      const cardH = 160;
      const gapX = 24;
      const gapY = 24;
      const cols = SELECT_COLS;
      const rows = Math.ceil(STAGES.length / cols);
      const gridW = cols * cardW + (cols - 1) * gapX;
      const gridH = rows * cardH + (rows - 1) * gapY;
      const gridX0 = (CANVAS_W - gridW) / 2;
      const gridY0 = 160;

      // 배경 글로우
      const glowCx = CANVAS_W / 2;
      const glowCy = gridY0 + gridH / 2;
      const glow = ctx.createRadialGradient(glowCx, glowCy, 0, glowCx, glowCy, 360);
      glow.addColorStop(0, 'rgba(255, 255, 255, 0.7)');
      glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(glowCx - 400, glowCy - gridH / 2 - 30, 800, gridH + 60);

      for (let i = 0; i < STAGES.length; i++) {
        const data = STAGES[i];
        const unlocked = isUnlocked(i);
        const selected = i === selectedIndex;
        const col = i % cols;
        const row = Math.floor(i / cols);
        const x = gridX0 + col * (cardW + gapX);
        const cardTop = gridY0 + row * (cardH + gapY);

        const hovered = lastMouse.x >= x && lastMouse.x <= x + cardW &&
          lastMouse.y >= cardTop && lastMouse.y <= cardTop + cardH;

        const isHighlighted = (hovered || selected) && unlocked;
        const floatY = isHighlighted ? Math.sin(performance.now() / 300) * 6 - 8 : 0;
        const cardY = cardTop + floatY;

        if (isHighlighted) {
          ctx.shadowColor = 'rgba(180, 140, 100, 0.25)';
          ctx.shadowBlur = 16;
          ctx.shadowOffsetY = 8;
        }

        // 카드 하단부
        ctx.fillStyle = isHighlighted ? '#e0b88f' : COLORS.panelBorder;
        ctx.beginPath();
        ctx.roundRect(x, cardY + 6, cardW, cardH, 20);
        ctx.fill();

        // 카드 윗면 (잠긴 상태면 약간 어두운 색)
        ctx.fillStyle = isHighlighted ? COLORS.highlight : (unlocked ? COLORS.panel : '#f2efe9');
        ctx.strokeStyle = isHighlighted ? COLORS.accent : COLORS.panelBorder;
        ctx.lineWidth = isHighlighted ? 3 : 2;
        ctx.beginPath();
        ctx.roundRect(x, cardY, cardW, cardH, 20);
        ctx.fill();
        ctx.stroke();

        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        ctx.shadowOffsetY = 0;

        if (!unlocked) {
          // 잠긴 스테이지: 자물쇠 아이콘만 표시
          drawLockIcon(x + cardW / 2, cardY + cardH / 2, 60);
        } else {
          // 해금된 스테이지: 미니멀리즘 테마 (숫자, 텍스트, 별)
          ctx.fillStyle = COLORS.text; // 다른 글자 색과 동일하게
          ctx.font = uiFont(FONT.h1, 'bold'); // 숫자 크기 줄임
          ctx.fillText(String(data.id), x + cardW / 2, cardY + 46); // 전체적으로 위로 올림

          ctx.fillStyle = COLORS.text;
          ctx.font = uiFont(FONT.body); // 제목 크기 키움
          ctx.fillText(data.name, x + cardW / 2, cardY + 92); // 전체적으로 위로 올림

          const earned = save[data.id] || 0;
          ctx.font = '24px serif'; // 별 크기 키움
          for (let s = 0; s < 3; s++) {
            ctx.fillStyle = s < earned ? COLORS.star : '#ebdcc5';
            ctx.fillText('★', x + cardW / 2 + (s - 1) * 22, cardY + 130); // 별 간격은 줄이고 위로 올림
          }

          hitAreas.push({
            x, y: cardY, w: cardW, h: cardH,
            action: () => startStory(i),
            hoverAction: () => {
              if (selectedIndex !== i) {
                selectedIndex = i;
              }
            }
          });
        }
      }

      ctx.font = uiFont(FONT.caption);
      ctx.fillStyle = COLORS.textSub;
      ctx.fillText('선택: ← ↑ ↓ → | 시작: Enter | 타이틀로: ESC', CANVAS_W / 2, CANVAS_H - 40);
    }

    // 플레이 화면
    function renderPlay() {
      const { x: ox, y: oy } = mapOffset();

      // 스테이지 이름 (중앙 정렬)
      ctx.font = uiFont(FONT.h4, 'bold'); // 글씨 크기 키움
      ctx.fillStyle = COLORS.textSub;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const header = mode === 'endless' ? `무한 모드 -- Round ${endlessRound}` : `Stage ${stage.id} — ${stage.name}`;
      ctx.fillText(header, CANVAS_W / 2, 40);

      // 무한 모드 목숨 HUD (좌상단 하트) + 우상단 평균 별점
      if (mode === 'endless') {
        const hudY = GAME_Y - 30 + 2; 

        // 1. 좌상단 (주문서 위) 하트
        const hudX = SIDE_L_X + SIDE_W / 2;
        drawHearts(hudX, hudY, endlessLives, 'center');
        
        const breakT = failed ? (performance.now() - failedAt) / HEART_BREAK_MS : 1;
        if (failed && breakT < 1) {
          const gap = UI.gap;
          // align 'center'에서 전체 목숨이 원래 (endlessLives + 1)개였을 때의 맨 오른쪽 하트 위치
          const oldLives = endlessLives + 1;
          const oldStartX = hudX - (oldLives - 1) * gap / 2;
          const slotX = oldStartX + endlessLives * gap;
          drawHeartBreak(slotX, hudY, breakT);
        }

        // 2. 우상단 (내 버거 위) 평균 별점
        const rightHudX = SIDE_R_X + SIDE_W / 2;
        const currentAvg = endlessClears > 0 ? (endlessStarSum / endlessClears).toFixed(1) : '-';
        ctx.fillStyle = COLORS.starFull;
        ctx.font = uiFont(FONT.bodyLg, 'bold');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`평균 ★ ${currentAvg}`, rightHudX, hudY);
      }

      renderTimeBar();
      renderOrder();
      renderStack();

      // 함정을 먹으면 게임 영역이 잠깐 흔들린다
      ctx.save();
      if (performance.now() < shakeUntil) {
        ctx.translate((Math.random() * 2 - 1) * 3, (Math.random() * 2 - 1) * 3);
      }

      // 정사각 게임 영역 패널 (라인 박스 제거)
      // drawPanel(GAME_X - 10, GAME_Y - 10, GAME_SIZE + 20, GAME_SIZE + 20);

      const cs = stage.cell;
      const mw = stage.cols * cs;
      const mh = stage.rows * cs;

      // 맵 테두리 (Outer shadow & Border radius)
      ctx.save();
      ctx.shadowColor = 'rgba(120, 100, 80, 0.2)';
      ctx.shadowBlur = 16;
      ctx.shadowOffsetY = 4;
      ctx.fillStyle = COLORS.floorLight;
      ctx.beginPath();
      ctx.roundRect(ox, oy, mw, mh, 16);
      ctx.fill();

      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // 둥근 테두리 안쪽으로 클리핑
      ctx.clip();

      // 맵 바닥 + 셀
      for (let r = 0; r < stage.rows; r++) {
        for (let c = 0; c < stage.cols; c++) {
          const cell = stage.cells[r][c];
          const px = ox + c * cs;
          const py = oy + r * cs;

          if (cell.type === 'wall') {
            ctx.fillStyle = COLORS.wall;
            ctx.fillRect(px, py, cs, cs);
            // 벽 상단/좌측 하이라이트 (입체감)
            ctx.fillStyle = COLORS.wallHighlight;
            ctx.fillRect(px, py, cs, 2);
            ctx.fillRect(px, py, 2, cs);
          } else {
            ctx.fillStyle = (r + c) % 2 === 0 ? COLORS.floorLight : COLORS.floorDark;
            ctx.fillRect(px, py, cs, cs);
          }

          if (cell.emoji) {
            ctx.font = Math.round(cs * 0.62) + 'px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(cell.emoji, px + cs / 2, py + cs / 2 + 2);
          }
        }
      }

      // 클리핑 해제
      ctx.restore();

      // 캐릭터 (SVG, 상황별 표정)
      const pcx = ox + player.drawX * cs + cs / 2;
      const pcy = oy + player.drawY * cs + cs / 2;
      const sinceEat = performance.now() - lastEatAt;
      const lastEaten = stack.length > 0 ? stack[stack.length - 1] : null;
      const justAteTrap = sinceEat < YUM_MS && lastEaten && lastEaten.isTrap;

      let charImg = IMG.charDefault;
      if (failed) charImg = IMG.charSad;
      else if (justAteTrap) charImg = IMG.charSad;
      else if (sinceEat < YUM_MS) charImg = IMG.charYum;
      // 섭취 직후 살짝 부풀었다 돌아오는 냠냠 연출
      const pop = sinceEat < YUM_MS ? 1 + 0.14 * (1 - sinceEat / YUM_MS) : 1;
      const size = cs * 0.96 * pop;
      if (charImg.complete && charImg.naturalWidth) {
        ctx.drawImage(charImg, pcx - size / 2, pcy - size / 2, size, size);
      }

      ctx.restore(); // 흔들림은 게임 영역에만 적용

      // 하단 조작 안내
      ctx.font = uiFont(FONT.caption);
      ctx.fillStyle = COLORS.textSub;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const playHint = mode === 'endless'
        ? '이동: 방향키 or WASD | 나가기: ESC'
        : '이동: 방향키 or WASD | 재시작: R | 스테이지 선택: ESC';
      ctx.fillText(playHint, CANVAS_W / 2, CANVAS_H - 40);

      // 클리어 팝업 (위쪽 번 착지 연출이 끝난 뒤 표시)
      if (completed && performance.now() - completedAt > CLEAR_POPUP_DELAY_MS) {
        renderClearPopup();
      }
      // 실패 팝업 (무한 모드는 하트 깨짐 연출이 끝난 뒤 표시)
      if (failed && (mode !== 'endless' || performance.now() - failedAt > HEART_BREAK_MS)) {
        renderFailPopup();
      }

      if (confirming) renderConfirmPopup();
      if (onboarding) renderOnboardingPopup();
    }

    // 상단 남은 시간 바 (게임 영역 위)
    function renderTimeBar() {
      const gap = 22; // 좌우 간격과 동일하게 맞춤
      const barH = 16;
      const bx = GAME_X;
      const by = GAME_Y - gap - barH; // 게임영역에 더 가깝게 내림
      const ratio = timeLeft / stage.timeLimit;

      // 텍스트 너비 고려
      const textStr = `${Math.ceil(timeLeft)}s`;
      const textW = 40; // 텍스트 영역
      const barW = GAME_SIZE - textW - 12; // 텍스트 포함 너비가 GAME_SIZE가 되도록

      ctx.fillStyle = COLORS.timerBg;
      ctx.beginPath();
      ctx.roundRect(bx, by, barW, barH, barH / 2);
      ctx.fill();

      if (ratio > 0) {
        // 남은 비율에 따라 초록 → 주황 → 빨강, 20% 이하에서는 깜빡이며 경고
        ctx.fillStyle = ratio > 0.5 ? COLORS.timerGreen : ratio > 0.2 ? COLORS.timerOrange : COLORS.timerRed;
        if (ratio <= 0.2 && !completed && !failed) {
          ctx.globalAlpha = 0.55 + 0.45 * Math.abs(Math.sin(performance.now() / 180));
        }
        ctx.beginPath();
        ctx.roundRect(bx, by, barW * ratio, barH, barH / 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      ctx.fillStyle = COLORS.text;
      ctx.font = uiFont(FONT.bodySm, 'bold');
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(textStr, bx + GAME_SIZE, by + barH / 2 + 1);
    }

    // 좌측 주문서 패널: 레시피 순서 표시, 다음에 먹을 재료 하이라이트
    function renderOrder() {
      drawPanel(SIDE_L_X, GAME_Y, SIDE_W, GAME_SIZE); // 게임 영역과 Y, 높이 동일하게
      const panelCx = SIDE_L_X + SIDE_W / 2;
      const names = eatenNames();
      // 다음에 먹을 재료 = 주문서에서 아직 안 먹은 첫 재료
      const nextName = stage.recipe.find((name) => !names.includes(name));

      drawPanelHeader(SIDE_L_X, '주문서');

      for (let i = 0; i < stage.recipe.length; i++) {
        const name = stage.recipe[i];
        const code = NAME_TO_CODE[name];
        const eaten = names.includes(name);
        const y = GAME_Y + 90 + i * 40;

        // 다음에 먹을 재료 하이라이트 (좌측 액센트 바 + 연한 배경)
        if (name === nextName) {
          ctx.fillStyle = COLORS.highlightBorder;
          ctx.beginPath();
          ctx.roundRect(panelCx - 72, y - 16, 3, 32, 1.5);
          ctx.fill();
          ctx.fillStyle = COLORS.highlight;
          ctx.beginPath();
          ctx.roundRect(panelCx - 68, y - 16, 136, 32, 8);
          ctx.fill();
        }

        ctx.globalAlpha = eaten ? 0.35 : 1;
        ctx.font = uiFont(FONT.bodySm);
        ctx.fillStyle = COLORS.text;
        ctx.textAlign = 'right';
        ctx.fillText(`${i + 1}.`, panelCx - 34, y);
        ctx.font = '26px serif';
        ctx.textAlign = 'center';
        ctx.fillText(INGREDIENTS[code].emoji, panelCx, y);
        ctx.globalAlpha = 1;

        // 먹은 재료 체크 표시
        if (eaten) {
          ctx.font = uiFont(FONT.bodySm);
          ctx.fillStyle = COLORS.check;
          ctx.fillText('✓', panelCx + 44, y);
        }
      }
    }

    // 실패 팝업
    function renderFailPopup() {
      overlayFull();

      const cw = 340;
      let ch;
      // 실패 팝업 높이: 스테이지 모드 및 무한 모드(목숨 남음)는 300, 무한 모드 완전 실패는 264
      if (mode === 'endless' && endlessLives <= 0) {
        ch = 264;
      } else {
        ch = 300;
      }
      
      const cx = (CANVAS_W - cw) / 2;
      const cy = (CANVAS_H - ch) / 2;
      drawCard(cx, cy, cw, ch, UI.radius);

      const cardCx = cx + cw / 2;
      const cardCy = cy + ch / 2;

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = COLORS.text;
      ctx.font = uiFont(FONT.h2, 'bold');
      ctx.fillText(failedReason === 'trap' ? '영업 실패... 😥' : '시간 초과... ⏰', cardCx, cardCy - 80);

      if (mode === 'endless') {
        if (endlessLives > 0) {
          // 목숨 남음: 하트 표시 + 같은 맵 재도전
          drawHearts(cardCx, cardCy - 30, endlessLives, 'center');
          ctx.font = uiFont(FONT.bodySm);
          ctx.fillStyle = COLORS.textSub;
          ctx.fillText(`목숨 ${endlessLives}개 남음 · ${endlessRound}라운드 재도전`, cardCx, cardCy + 6);
        } else {
          // 목숨 소진: 런 종료 — 이번 런 요약(도달·평균) + 최고 기록
          const thisAvg = endlessClears > 0 ? (endlessStarSum / endlessClears).toFixed(1) : '-';
          const rec = loadEndlessRecord();
          ctx.font = uiFont(FONT.bodyLg, 'bold');
          ctx.fillStyle = COLORS.text;
          ctx.fillText(`${endlessRound}라운드에서 멈췄어요`, cardCx, cardCy - 36);
          ctx.font = uiFont(FONT.bodySm);
          ctx.fillStyle = COLORS.textSub;
          ctx.fillText(`이번 런 · 평균 ★${thisAvg}`, cardCx, cardCy - 8);
          ctx.fillText(`최고 기록 ${rec.bestRound}라운드 · ★${rec.bestAvg.toFixed(1)}`, cardCx, cardCy + 18);
        }
      } else {
        ctx.font = uiFont(FONT.bodySm);
        ctx.fillStyle = COLORS.textSub;
        ctx.fillText(`"${failComment}"`, cardCx, cardCy - 20);
      }

      renderResultTextLinks(cardCx, cardCy + 55);
    }

    // 우측 버거 스택 패널 (아래 → 위, 레이어형 SVG)
    function renderStack() {
      drawPanel(SIDE_R_X, GAME_Y, SIDE_W, GAME_SIZE); // 게임 영역과 Y, 높이 동일하게
      const panelCx = SIDE_R_X + SIDE_W / 2;
      const baseY = GAME_Y + GAME_SIZE - 30; // 내버거 바닥 높이 살짝 조정
      const now = performance.now();
      const s = STACK_LAYER_W / 120;

      drawPanelHeader(SIDE_R_X, '내 버거');

      // 아래 번 (시작 상태)
      drawImg(IMG.bunBottom, panelCx, baseY, s);

      // 스택이 비어 있을 때 안내
      if (stack.length === 0 && !completed) {
        ctx.font = uiFont(FONT.small);
        ctx.fillStyle = COLORS.textSub;
        ctx.fillText('재료를 모아보세요!', panelCx, baseY - 50);
      }

      // 먹은 순서대로 위로 쌓기
      for (let i = 0; i < stack.length; i++) {
        const item = stack[i];
        const t = Math.min(1, (now - item.eatenAt) / EAT_POP_MS);
        const drop = (1 - easeOutBack(t)) * 26; // 위에서 떨어져 통통 튀며 안착
        drawImg(layerImage(item), panelCx, baseY - STACK_STEP * (i + 1) - drop, s);
      }

      // 위쪽 번: 평소엔 패널 맨 위에 떠 있고, 완성되면 스택 위로 떨어져 덮는다
      const floatY = GAME_Y + 120;
      let bunY = floatY;
      if (completed) {
        const t = Math.min(1, (now - completedAt) / BUN_FALL_MS);
        const targetY = baseY - STACK_STEP * (stack.length + 1);
        bunY = floatY + (targetY - floatY) * t * t; // 가속하며 낙하
      }
      drawImg(IMG.bunTop, panelCx, bunY, s);
    }

    // 캔버스 전체 반투명 오버레이
    function overlayFull() {
      ctx.fillStyle = COLORS.overlay;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }

    // 팝업 카드 배경 (그림자 + 둥근 사각형). 결과/확인/온보딩 팝업 공용.
    function drawCard(x, y, w, h, radius) {
      ctx.shadowColor = 'rgba(0,0,0,0.15)';
      ctx.shadowBlur = 24;
      ctx.fillStyle = COLORS.panel;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
    }

    // 목숨 하트 그리기 (채워진 하트만 lives개). align 'left'는 x부터, 'center'는 x를 중앙 기준.
    function drawHearts(x, y, lives, align) {
      if (lives <= 0) return;
      const gap = UI.gap;
      ctx.font = '19px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = COLORS.timerRed;
      const startX = align === 'center' ? x - (lives - 1) * gap / 2 : x + gap / 2;
      for (let i = 0; i < lives; i++) ctx.fillText('♥', startX + i * gap, y);
    }

    // 잃은 하트 깨짐 연출: 두 조각이 갈라지며 떨어지고 페이드 아웃 (t: 0→1)
    function drawHeartBreak(cx, cy, t) {
      const e = 1 - Math.pow(1 - t, 2); // 감속
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - t);
      ctx.font = '19px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = COLORS.timerRed;
      const drop = e * 14;
      const spread = e * 7;
      const tilt = e * 0.5;
      // 왼쪽 반쪽
      ctx.save();
      ctx.translate(cx - spread, cy + drop);
      ctx.rotate(-tilt);
      ctx.beginPath();
      ctx.rect(-12, -12, 12, 24); // 오른쪽 절반을 잘라 왼쪽 반쪽만 보이게
      ctx.clip();
      ctx.fillText('♥', 0, 0);
      ctx.restore();
      // 오른쪽 반쪽
      ctx.save();
      ctx.translate(cx + spread, cy + drop);
      ctx.rotate(tilt);
      ctx.beginPath();
      ctx.rect(0, -12, 12, 24);
      ctx.clip();
      ctx.fillText('♥', 0, 0);
      ctx.restore();
      ctx.restore();
    }

    // 클리어 팝업
    function renderClearPopup() {
      overlayFull();

      const cw = 360;
      let ch;
      // 완료 팝업 높이: 무한 모드는 324, 스테이지 모드는 다음 판 유무에 따라 360 또는 320
      if (mode === 'endless') {
        ch = 324;
      } else {
        ch = hasNext() ? 360 : 320;
      }
      const showNext = hasNext();
      
      const cx = (CANVAS_W - cw) / 2;
      const cy = (CANVAS_H - ch) / 2;
      drawCard(cx, cy, cw, ch, UI.radius);

      const cardCx = cx + cw / 2;
      const cardCy = cy + ch / 2;

      const popupAge = performance.now() - completedAt - CLEAR_POPUP_DELAY_MS;
      // 다음 버튼이 있으면(showNext) 그 자리를 위해 제목·별을 위로 올린다
      const titleY = cardCy + (showNext ? -105 : -90);
      const starsY = cardCy + (showNext ? -50 : -30);

      let titleText = '버거 완성! 🎉';
      if (stars === 1) titleText = '일단 완성.. 😅';
      else if (stars === 3) titleText = '완벽한 버거 ✨';

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = COLORS.text;
      ctx.font = uiFont(FONT.h2, 'bold');
      ctx.fillText(titleText, cardCx, titleY);

      // 별점: 하나씩 통통 튀며 등장
      const starGap = 48;
      for (let i = 0; i < 3; i++) {
        const st = Math.min(1, Math.max(0, (popupAge - i * 200) / 280));
        if (st === 0) continue;
        ctx.font = `${Math.max(1, Math.round(40 * easeOutBack(st)))}px serif`;
        ctx.fillStyle = i < stars ? COLORS.star : COLORS.starEmpty;
        ctx.fillText('★', cardCx + (i - 1) * starGap, starsY);
      }

      if (showNext) {
        // 무한 모드 3별 보상 안내
        if (mode === 'endless' && endlessHeartEarned) {
          ctx.font = uiFont(FONT.bodySm, 'bold');
          ctx.fillStyle = COLORS.timerRed;
          ctx.fillText('완벽 클리어! ♥ +1', cardCx, cardCy - 16);
        }
        drawButton(cardCx - 110, cardCy, 220, 44, mode === 'endless' ? '다음 주문 (Enter)' : '다음 스테이지 (Enter)', () => goNext());
        renderResultTextLinks(cardCx, cardCy + 80);
      } else {
        renderResultTextLinks(cardCx, cardCy + 60);
      }
    }

    // 텍스트 형태의 링크 버튼을 그리는 헬퍼 함수
    function drawTextLink(x, y, text, action) {
      ctx.font = uiFont(FONT.bodySm, 'bold');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      const w = ctx.measureText(text).width;
      const h = 24;
      const hovered = lastMouse.x >= x - w / 2 && lastMouse.x <= x + w / 2 &&
        lastMouse.y >= y - h / 2 && lastMouse.y <= y + h / 2;

      ctx.fillStyle = hovered ? COLORS.highlight : COLORS.textSub;
      ctx.fillText(text, x, y);

      if (hovered) {
        ctx.strokeStyle = COLORS.highlight;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x - w / 2, y + 12);
        ctx.lineTo(x + w / 2, y + 12);
        ctx.stroke();
      }

      hitAreas.push({ x: x - w / 2, y: y - h / 2, w, h, action });
    }

    // 결과 화면 공통 텍스트 링크 (모드·상황별)
    function renderResultTextLinks(x, y) {
      if (mode === 'endless') {
        if (failed && endlessLives > 0) {
          drawTextLink(x, y, '계속하기 (Enter)', () => endlessAfterFail());
          drawTextLink(x, y + 36, '타이틀로 나가기 (ESC)', exitPlay);
        } else {
          // 성공(완료) 화면이거나, 무한 모드 완전 실패(목숨 0)일 때는 재시도 버튼 없음
          drawTextLink(x, y, '타이틀로 나가기 (ESC)', exitPlay);
        }
      } else {
        drawTextLink(x, y, '다시 하기 (R)', () => restartStage());
        drawTextLink(x, y + 36, '스테이지 선택 (ESC)', exitToSelect);
      }
    }

    function renderConfirmPopup() {
      // 반투명 배경 (캔버스 전체)
      overlayFull();

      // 팝업 카드
      const boxW = 360;
      const boxH = 200;
      const bx = (CANVAS_W - boxW) / 2;
      const by = (CANVAS_H - boxH) / 2;
      drawCard(bx, by, boxW, boxH, 20);

      ctx.fillStyle = COLORS.text;
      ctx.font = uiFont(FONT.h3, 'bold');
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const exitMsg = mode === 'endless' ? '타이틀로 나갈까요?' : '스테이지 선택으로 나갈까요?';
      const msg = confirming === 'restart' ? '다시 시작할까요?' : exitMsg;
      ctx.fillText(msg, CANVAS_W / 2, by + 58);

      drawButton(CANVAS_W / 2 - 150, by + 113, 140, 42, '확인 (Enter)', () => {
        const action = confirming;
        confirming = null;
        if (action === 'restart') restartStage();
        else exitPlay();
      });
      drawButton(CANVAS_W / 2 + 10, by + 113, 140, 42, '취소 (ESC)', () => {
        confirming = null;
      });
    }

    // 온보딩 팝업 내용
    const ONBOARD_ROWS_STORY = [
      ['🕹️', '*방향키* 또는 *WASD*로 움직여요.'],
      ['📋', '주문서의 재료들을 *순서대로* 모아요.'],
      ['🍔', '시간 안에 *먹을 수 있는* 버거를 완성해요!'],
    ];

    const ONBOARD_ROWS_ENDLESS = [
      ['🗺️', '라운드마다 *랜덤한 맵과 주문*이 계속돼요.'],
      ['💔', '실패하면 *하트를 잃고*, 모두 사라지면 *게임이 끝나요.*'],
      ['🍔', '*완벽한 버거*를 만들면 하트가 다시 채워져요.'],
      ['🔥', '어디까지 갈 수 있을지 *최고 기록*에 도전하세요!'],
    ];

    function renderOnboardingPopup() {
      overlayFull();
      const isEndless = (onboarding === 'endless');
      const rows = isEndless ? ONBOARD_ROWS_ENDLESS : ONBOARD_ROWS_STORY;
      
      const iconSize = 30;
      const fontSize = FONT.bodyLg;
      const textGap = 16; 

      // 1. 팝업 크기 명시적 하드코딩
      const cw = isEndless ? 540 : 440;
      const ch = isEndless ? 400 : 340;
      
      const cx = (CANVAS_W - cw) / 2;
      const cy = (CANVAS_H - ch) / 2;
      const cardCx = cx + cw / 2;

      drawCard(cx, cy, cw, ch, UI.radius);

      // 2. 규칙 행 그리기
      const blockStartX = cx + 50; // 좌우 여백을 고정값으로 처리
      const marginTop = 48;
      let ry = cy + marginTop + 28; // 상단 여백 + 줄 간격의 절반
      
      for (const [icon, text] of rows) {
        // 아이콘 렌더링
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = (icon === '♥' || icon === '💔') ? COLORS.timerRed : COLORS.text;
        ctx.font = `${iconSize}px serif`;
        ctx.fillText(icon, blockStartX + iconSize / 2, ry + 2);

        // 텍스트 렌더링 (볼드 파싱)
        ctx.textAlign = 'left';
        let currentX = blockStartX + iconSize + textGap;
        const parts = text.split('*');
        for (let i = 0; i < parts.length; i++) {
          if (!parts[i]) continue;
          const isBold = i % 2 === 1;
          ctx.font = uiFont(fontSize, isBold ? 'bold' : 'normal');
          ctx.fillStyle = isBold ? COLORS.text : COLORS.textSub;
          ctx.fillText(parts[i], currentX, ry);
          currentX += ctx.measureText(parts[i]).width;
        }
        ry += 56;
      }

      // 3. 시작 버튼
      const btnW = UI.btnW;
      const btnH = UI.btnH;
      const marginBot = 36;
      drawButton(cardCx - btnW / 2, cy + ch - (btnH + marginBot), btnW, btnH, '시작! (Enter)', () => dismissOnboarding());
    }

    let lastTime = performance.now();
    function frame(now) {
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;
      if (screen === 'play') update(dt);
      render();
      updateCursor();
      requestAnimationFrame(frame);
    }

    verifyStages();
    requestAnimationFrame(frame);
  </script>
</body>

</html>
